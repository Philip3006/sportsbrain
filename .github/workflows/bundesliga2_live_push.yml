name: 2.BL Live-Push (Anpfiff/Tor/HZ/Abpfiff)

# STAB-SCHED-AUTH-001: Cloudflare Worker cron is PRIMARY scheduler authority.
# Cloudflare dispatches repository_dispatch every 2 min during match windows.
# GH schedule entries are SLOW FALLBACK (*/5 minimum interval) — they run if
# CF dispatch fails. Remove GH schedules only after CF path is verified stable
# for 7+ match days.
#
# Rollback: disable CF cron in wrangler.toml — GH fallback immediately takes over.
# GH fallback order (UTC): Fri 18-22 / Sat 11-22 / Sun 11-22

on:
  repository_dispatch:
    types: [sportsbrain_bl2_live_push]
  schedule:
    # SLOW FALLBACK — NOT PRIMARY AUTHORITY. CF is primary; these run only if
    # CF dispatch fails. GH Actions minimum supported interval is */5.
    - cron: '*/5 18-22 * * 5'   # Fri CEST match window
    - cron: '*/5 11-22 * * 6'   # Sat CEST match window
    - cron: '*/5 11-22 * * 0'   # Sun CEST match window
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'ISO-8601 UTC timestamp (optional, for lag tracking)'
        required: false
        default: ''

concurrency:
  group: bundesliga2_live_push
  cancel-in-progress: true   # later CF dispatch supersedes queued earlier one

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  live-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # STAB-SCHED-AUTH-001: measure scheduler lag for P95 monitoring.
      # scheduled_at comes from Cloudflare client_payload or workflow_dispatch input.
      # GH fallback runs (schedule:) have no provable scheduled_at → lag_s is empty (null).
      - name: Compute scheduler lag
        id: lag
        run: |
          SCHEDULED_AT="${{ github.event.client_payload.scheduled_at || inputs.scheduled_at }}"
          IDEMPOTENCY_KEY="${{ github.event.client_payload.idempotency_key || '' }}"
          SCHEDULER="${{ github.event.client_payload.scheduler || (github.event_name == 'schedule' && 'gh_cron_fallback' || 'workflow_dispatch') }}"
          if [ -n "$SCHEDULED_AT" ]; then
            NOW_EPOCH=$(date +%s)
            SCHED_EPOCH=$(date -d "$SCHEDULED_AT" +%s 2>/dev/null || python3 -c "import datetime; print(int(datetime.datetime.fromisoformat('$SCHEDULED_AT'.replace('Z','+00:00')).timestamp()))")
            LAG_S=$((NOW_EPOCH - SCHED_EPOCH))
            echo "lag_s=$LAG_S" >> $GITHUB_OUTPUT
            echo "scheduler_lag=${LAG_S}s (scheduled_at=$SCHEDULED_AT, scheduler=$SCHEDULER)"
            if [ "$LAG_S" -gt 120 ]; then
              echo "::warning::SCHEDULER_LAG_EXCEEDED: ${LAG_S}s > 120s SLA target (scheduled_at=$SCHEDULED_AT)"
            fi
          else
            # No provable scheduled_at: GH fallback or manual dispatch.
            # Do NOT fabricate lag_s=0. Output empty so health_writer receives null.
            echo "lag_s=" >> $GITHUB_OUTPUT
            echo "no scheduled_at — GH fallback or manual trigger, lag unknown"
          fi
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> $GITHUB_OUTPUT
          echo "scheduler=$SCHEDULER" >> $GITHUB_OUTPUT

      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Checkout private ledger (read-only)
        uses: actions/checkout@v4
        with:
          repository: Philip3006/sportsbrain-ledger
          token: ${{ secrets.LEDGER_PRIVATE_READ_PAT }}
          path: private-ledger
          fetch-depth: 1

      - name: Set ledger directory
        run: echo "SPORTSBRAIN_LEDGER_DIR=${{ github.workspace }}/private-ledger" >> $GITHUB_ENV

      - name: Poll ESPN + push
        id: poll
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: |
          python scripts/bundesliga2_live_push.py
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.poll.outputs.status || 'error' }}"
          SCHEDULER="${{ steps.lag.outputs.scheduler || 'unknown' }}"
          SCHEDULED_AT="${{ steps.lag.outputs.scheduled_at || github.event.client_payload.scheduled_at || '' }}"
          LAG_S="${{ steps.lag.outputs.lag_s }}"
          IDEMPOTENCY_KEY="${{ steps.lag.outputs.idempotency_key || '' }}"
          EXIT_CODE=1
          if [ "${{ job.status }}" = "success" ]; then
            EXIT_CODE=0
          fi
          HEALTH_ARGS=(
            --job bundesliga2_live_push
            --status "$STATUS"
            --exit-code "$EXIT_CODE"
            --scheduler "$SCHEDULER"
          )
          [ -n "$SCHEDULED_AT" ]    && HEALTH_ARGS+=(--scheduled-at "$SCHEDULED_AT")
          [ -n "$LAG_S" ]           && HEALTH_ARGS+=(--scheduler-lag-s "$LAG_S")
          [ -n "$IDEMPOTENCY_KEY" ] && HEALTH_ARGS+=(--idempotency-key "$IDEMPOTENCY_KEY")
          python -m src.monitoring.health_writer "${HEALTH_ARGS[@]}" || true

      - name: Commit cache + health
        if: always()
        run: |
          git add docs/data/bundesliga2_live_scores.json || true
          git add -f data/cache/bundesliga2_live_scores.json || true
          git add -f results/health/bundesliga2_live_push.json || true
          bash scripts/_bot_commit_push.sh "auto: bl2 live $(date -u +%H:%M) [lag=${{ steps.lag.outputs.lag_s || 'unknown' }}s]"
