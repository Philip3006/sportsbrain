name: Tennis LGBM Retrain (daily)

on:
  schedule:
    # 05:00 UTC täglich — nach tennis_settle (alle 2h bis 22 UTC), vor dem Morgen-Scan (06 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tennis-lgbm-retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain Tennis LGBM (frische Daten von tennis-data.co.uk)
        id: retrain
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # Kein Cache auf CI → tennis-data.co.uk liefert immer aktuelle 2026-Matches
          python scripts/tennis_train.py --force-persist
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Recalibrate aus settled Signalen
        id: recal
        if: steps.retrain.outputs.status == 'ok'
        run: |
          python scripts/tennis_signal_recalibrate.py
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.retrain.outputs.status || 'error' }}"
          EXIT_CODE=1
          if [ "${{ job.status }}" = "success" ]; then
            EXIT_CODE=0
          fi
          python -m src.monitoring.health_writer --job tennis_retrain --status "$STATUS" --exit-code "$EXIT_CODE" || true

      - name: Commit results
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add models/tennis_lgbm/ results/tennis_cal_stats.json || true
          git add -f results/health/tennis_retrain.json || true
          git diff --staged --quiet || git commit -m "auto: tennis lgbm retrain $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --autostash --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict on attempt $i, retrying"; }
            git push origin main && exit 0
            echo "[push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[push] giving up after 5 attempts" >&2; exit 1
