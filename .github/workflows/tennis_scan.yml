name: Tennis Scan (year-round, multi-tournament)

on:
  schedule:
    # 6× täglich ganzjährig — Discovery filtert via TheOddsAPI /sports
    # auf aktive Turniere. Vor Saison/Off-Season einfach kein Match → no-op.
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:        # manuell auslösbar
    inputs:
      all_live:
        description: 'Override: erzwingt mode=live für alle Kategorien'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tennis-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tennis scan (multi-tournament)
        id: scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: |
          ALL_LIVE_FLAG=""
          if [ "${{ inputs.all_live }}" = "true" ]; then
            ALL_LIVE_FLAG="--all-live"
          fi
          # --no-ledger: Cron platziert keine Bets direkt (feedback_no_auto_log).
          # User bestätigt via PWA → consume_pending_bets.yml schreibt ins Ledger.
          # J8-B13: Einmaliger Retry mit 60s Backoff bei Fail — deckt transiente
          # TheOddsAPI-Ausfälle ab, ohne STALE-Symptom für den User zu erzeugen.
          if ! python scripts/tennis_scan.py --bankroll 100 --no-ledger $ALL_LIVE_FLAG; then
            echo "[tennis_scan] first attempt failed → retry in 60s"
            sleep 60
            python scripts/tennis_scan.py --bankroll 100 --no-ledger $ALL_LIVE_FLAG
          fi
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.scan.outputs.status || 'error' }}"
          python -m src.monitoring.health_writer --job tennis_scan --status "$STATUS" --exit-code ${{ job.status == 'success' && 0 || 1 }} || true

      - name: Commit results
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add results/tennis_scan_*.md docs/data/signals*.json results/health/tennis_scan.json || true
          git add -f data/cache/signal_history.jsonl || true
          git add data/cache/tennis_serve_snapshots/ || true
          git diff --staged --quiet || git commit -m "auto: tennis scan $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict on attempt $i, retrying"; }
            git push origin main && exit 0
            echo "[push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[push] giving up after 5 attempts" >&2; exit 1
