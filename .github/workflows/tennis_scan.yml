name: Tennis Scan (year-round, multi-tournament)

on:
  schedule:
    # 9× täglich ganzjährig — schließt den 21-06 UTC Gap für Nordamerika-Turniere.
    # 04 UTC: P0-A risk-state heartbeat — fills the 02→06 UTC dead zone so that
    # bankroll_state.published_at is never older than 2 h, supporting the 90-min
    # freshness threshold in contract.js (AUTH_STATE_MAX_AGE_MS).
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:        # manuell auslösbar
    inputs:
      all_live:
        description: 'Override: erzwingt mode=live für alle Kategorien'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tennis-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout private ledger (read-only)
        uses: actions/checkout@v4
        with:
          repository: Philip3006/sportsbrain-ledger
          token: ${{ secrets.LEDGER_PRIVATE_READ_PAT }}
          path: private-ledger
          fetch-depth: 1

      - name: Set ledger directory
        run: echo "SPORTSBRAIN_LEDGER_DIR=${{ github.workspace }}/private-ledger" >> $GITHUB_ENV

      - name: Run tennis scan (multi-tournament)
        id: scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: |
          ALL_LIVE_FLAG=""
          if [ "${{ inputs.all_live }}" = "true" ]; then
            ALL_LIVE_FLAG="--all-live"
          fi
          # --no-ledger: Cron platziert keine Bets direkt (feedback_no_auto_log).
          # User bestätigt via PWA → consume_pending_bets.yml schreibt ins Ledger.
          # J8-B13: Einmaliger Retry mit 60s Backoff bei Fail — deckt transiente
          # TheOddsAPI-Ausfälle ab, ohne STALE-Symptom für den User zu erzeugen.
          if ! python scripts/tennis_scan.py --bankroll 100 --no-ledger $ALL_LIVE_FLAG; then
            echo "[tennis_scan] first attempt failed → retry in 60s"
            sleep 60
            python scripts/tennis_scan.py --bankroll 100 --no-ledger $ALL_LIVE_FLAG
          fi
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.scan.outputs.status || 'error' }}"
          python -m src.monitoring.health_writer --job tennis_scan --status "$STATUS" --exit-code ${{ job.status == 'success' && 0 || 1 }} || true

      - name: Commit results
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add results/tennis_scan_*.md docs/data/signals*.json || true
          git add -f results/health/tennis_scan.json || true
          git add -f data/cache/signal_history.jsonl || true
          git add data/cache/tennis_serve_snapshots/ || true
          bash scripts/_bot_commit_push.sh "auto: tennis scan $(date +%Y-%m-%d)"
