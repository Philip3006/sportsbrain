name: Tennis Settle (auto)

on:
  schedule:
    # Alle 2 Stunden zwischen 06 und 22 UTC — Tennis-Matches enden ueber den Tag verteilt
    - cron: '15 6-22/2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tennis-settle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tennis settlement
        id: settle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/tennis_settle.py
          python scripts/backfill_signal_outcomes.py
          python scripts/update_betting_journal.py --sport tennis
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.settle.outputs.status || 'error' }}"
          python -m src.monitoring.health_writer --job tennis_settle --status "$STATUS" --exit-code ${{ job.status == 'success' && 0 || 1 }} || true

      - name: Commit results
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add results/ledger_*.csv results/betting_journal.md || true
          git add -f results/health/tennis_settle.json || true
          git add -f data/cache/signal_history.jsonl data/cache/signal_performance.json data/cache/journal_snapshots.jsonl || true
          git add docs/data/signals_philip.json docs/data/signals.json || true
          git diff --staged --quiet || git commit -m "auto: tennis settle $(date +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --autostash --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict on attempt $i, retrying"; }
            git push origin main && exit 0
            echo "[push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[push] giving up after 5 attempts" >&2; exit 1
