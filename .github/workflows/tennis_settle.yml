name: Tennis Settle (auto)

# STAB-SCHED-AUTH-001: Primary scheduler authority migrated to Cloudflare Worker.
# CF cron: 15 6-22/2 * * * → repository_dispatch sportsbrain_tennis_settle → this job.
# GH schedule retained as SLOW FALLBACK (every 4h) — remove once CF path verified stable.
#
# Rollback: change fallback schedule below back to '15 6-22/2 * * *' and disable CF cron.
#
# Settlement idempotency: tennis_settle.py checks settled flag in ledger before writing.
# Duplicate dispatch for the same slot is safe — second run settles nothing new.

on:
  repository_dispatch:
    types: [sportsbrain_tennis_settle]
  schedule:
    # SLOW FALLBACK — NOT PRIMARY AUTHORITY. Offset by 30 min from CF primary
    # slots (which fire at :15 past even hours: 06:15, 08:15, ..., 22:15).
    # GH fallback fires at :45 past odd hours: 07:45, 09:45, 11:45, 13:45,
    # 15:45, 17:45, 19:45, 21:45, 23:45. No collision with CF primary times.
    # Worst-case settlement delay if CF fails at any primary slot: ≤90 min.
    # Remove if CF path is verified stable for 7+ days.
    - cron: '45 7,9,11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'ISO-8601 UTC timestamp (optional, for lag tracking)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tennis-settle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # STAB-SCHED-AUTH-001: scheduler lag measurement.
      - name: Compute scheduler lag
        id: lag
        run: |
          SCHEDULED_AT="${{ github.event.client_payload.scheduled_at || inputs.scheduled_at }}"
          SCHEDULER="${{ github.event.client_payload.scheduler || (github.event_name == 'schedule' && 'gh_cron_fallback' || 'workflow_dispatch') }}"
          IDEMPOTENCY_KEY="${{ github.event.client_payload.idempotency_key || '' }}"
          if [ -n "$SCHEDULED_AT" ]; then
            NOW_EPOCH=$(date +%s)
            SCHED_EPOCH=$(python3 -c "import datetime; print(int(datetime.datetime.fromisoformat('$SCHEDULED_AT'.replace('Z','+00:00')).timestamp()))")
            LAG_S=$((NOW_EPOCH - SCHED_EPOCH))
            echo "lag_s=$LAG_S" >> $GITHUB_OUTPUT
            echo "scheduler=$SCHEDULER" >> $GITHUB_OUTPUT
            echo "Scheduler lag: ${LAG_S}s (source=$SCHEDULER)"
          else
            # No provable scheduled_at: GH fallback or manual dispatch.
            # Do NOT fabricate lag_s=0. Output empty so health_writer receives null.
            echo "lag_s=" >> $GITHUB_OUTPUT
            echo "scheduler=$SCHEDULER" >> $GITHUB_OUTPUT
          fi
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> $GITHUB_OUTPUT

      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout private ledger
        uses: actions/checkout@v4
        with:
          repository: Philip3006/sportsbrain-ledger
          token: ${{ secrets.LEDGER_PRIVATE_PAT }}
          path: private-ledger
          fetch-depth: 0

      - name: Configure ledger identity
        run: |
          git -C private-ledger config user.name "SportsBrain Bot"
          git -C private-ledger config user.email "bot@sportsbrain"

      - name: Run tennis settlement
        id: settle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSBRAIN_LEDGER_DIR: ${{ github.workspace }}/private-ledger
          # Idempotency metadata passed for observability — settlement logic checks
          # settled flag in ledger independently; this key is for logging only.
          SETTLE_IDEMPOTENCY_KEY: ${{ steps.lag.outputs.idempotency_key }}
        run: |
          python scripts/tennis_settle.py
          python scripts/backfill_signal_outcomes.py
          python scripts/update_betting_journal.py --sport tennis
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.settle.outputs.status || 'error' }}"
          SCHEDULER="${{ steps.lag.outputs.scheduler || 'unknown' }}"
          SCHEDULED_AT="${{ github.event.client_payload.scheduled_at || '' }}"
          LAG_S="${{ steps.lag.outputs.lag_s }}"
          IDEMPOTENCY_KEY="${{ steps.lag.outputs.idempotency_key || '' }}"
          EXIT_CODE=1
          if [ "${{ job.status }}" = "success" ]; then
            EXIT_CODE=0
          fi
          HEALTH_ARGS=(
            --job tennis_settle
            --status "$STATUS"
            --exit-code "$EXIT_CODE"
            --scheduler "$SCHEDULER"
          )
          [ -n "$SCHEDULED_AT" ]    && HEALTH_ARGS+=(--scheduled-at "$SCHEDULED_AT")
          [ -n "$LAG_S" ]           && HEALTH_ARGS+=(--scheduler-lag-s "$LAG_S")
          [ -n "$IDEMPOTENCY_KEY" ] && HEALTH_ARGS+=(--idempotency-key "$IDEMPOTENCY_KEY")
          python -m src.monitoring.health_writer "${HEALTH_ARGS[@]}" || true

      - name: Commit private ledger (fatal if ledger staging fails)
        env:
          SPORTSBRAIN_LEDGER_DIR: ${{ github.workspace }}/private-ledger
        run: |
          git -C private-ledger add ledger_*.csv
          git -C private-ledger add betting_journal.md
          if [ -f private-ledger/journal_snapshots.jsonl ]; then git -C private-ledger add journal_snapshots.jsonl; fi
          git -C private-ledger diff --cached --quiet && echo "[ledger] nothing to commit" && exit 0
          git -C private-ledger commit -m "auto: tennis settle $(date +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            git -C private-ledger fetch origin main
            git -C private-ledger rebase --autostash --strategy-option=theirs origin/main \
              || { git -C private-ledger rebase --abort 2>/dev/null || true; echo "[ledger push] rebase conflict attempt $i"; continue; }
            git -C private-ledger push origin main && exit 0
            echo "[ledger push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[ledger push] giving up after 5 attempts — ledger NOT persisted" >&2; exit 1

      - name: Commit public artifacts (health, signals, cache — non-fatal)
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add -f results/health/tennis_settle.json || true
          git add -f data/cache/signal_history.jsonl data/cache/signal_performance.json || true
          git add docs/data/signals_philip.json docs/data/signals.json || true
          git diff --staged --quiet && exit 0
          git commit -m "auto: tennis settle $(date +%Y-%m-%d\ %H:%M) UTC [lag=${{ steps.lag.outputs.lag_s || 0 }}s]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --autostash --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict on attempt $i, retrying"; }
            git push origin main && exit 0
            echo "[push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[push] giving up after 5 attempts" >&2; exit 1
