name: Tennis Settle (auto)

on:
  schedule:
    # Alle 2 Stunden zwischen 06 und 22 UTC — Tennis-Matches enden ueber den Tag verteilt
    - cron: '15 6-22/2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tennis-settle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout private ledger
        uses: actions/checkout@v4
        with:
          repository: Philip3006/sportsbrain-ledger
          token: ${{ secrets.LEDGER_PRIVATE_PAT }}
          path: private-ledger
          fetch-depth: 0

      - name: Configure ledger identity
        run: |
          git -C private-ledger config user.name "SportsBrain Bot"
          git -C private-ledger config user.email "bot@sportsbrain"

      - name: Run tennis settlement
        id: settle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSBRAIN_LEDGER_DIR: ${{ github.workspace }}/private-ledger
        run: |
          python scripts/tennis_settle.py
          python scripts/backfill_signal_outcomes.py
          python scripts/update_betting_journal.py --sport tennis
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Write health snapshot
        if: always()
        run: |
          STATUS="${{ steps.settle.outputs.status || 'error' }}"
          python -m src.monitoring.health_writer --job tennis_settle --status "$STATUS" --exit-code ${{ job.status == 'success' && 0 || 1 }} || true

      - name: Commit private ledger (fatal if ledger staging fails)
        env:
          SPORTSBRAIN_LEDGER_DIR: ${{ github.workspace }}/private-ledger
        run: |
          git -C private-ledger add ledger_*.csv
          git -C private-ledger add betting_journal.md
          if [ -f private-ledger/journal_snapshots.jsonl ]; then git -C private-ledger add journal_snapshots.jsonl; fi
          git -C private-ledger diff --cached --quiet && echo "[ledger] nothing to commit" && exit 0
          git -C private-ledger commit -m "auto: tennis settle $(date +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            git -C private-ledger fetch origin main
            git -C private-ledger rebase --autostash --strategy-option=theirs origin/main \
              || { git -C private-ledger rebase --abort 2>/dev/null || true; echo "[ledger push] rebase conflict attempt $i"; continue; }
            git -C private-ledger push origin main && exit 0
            echo "[ledger push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[ledger push] giving up after 5 attempts — ledger NOT persisted" >&2; exit 1

      - name: Commit public artifacts (health, signals, cache — non-fatal)
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add -f results/health/tennis_settle.json || true
          git add -f data/cache/signal_history.jsonl data/cache/signal_performance.json || true
          git add docs/data/signals_philip.json docs/data/signals.json || true
          git diff --staged --quiet && exit 0
          git commit -m "auto: tennis settle $(date +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --autostash --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict on attempt $i, retrying"; }
            git push origin main && exit 0
            echo "[push] attempt $i failed, backoff..."
            sleep $((RANDOM % 20 + 10))
          done
          echo "[push] giving up after 5 attempts" >&2; exit 1
