name: CI Gates (compile + smoke tests + lint)

# CEO-Roadmap O0-3 (Phase 0 — Production Reliability)
# Rule: CI red = kein Production Deployment.
# Hard gates:  compileall + core smoke tests + provenance tests
# Soft gate:   ruff (report only, bis Baseline gehärtet ist)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── HARD GATE 1: Syntax / Imports ──────────────────────────────────
      - name: Compile all source
        run: python -m compileall -q src scripts

      # ── HARD GATE 2: Core smoke tests (stabile, netzunabhängige Suite) ──
      # Bewusst schmal gehalten — bei Instabilität der Vollsuite wachsen wir
      # diese Liste kontrolliert. Never skip syntax/imports/core-smoke.
      - name: Core smoke tests
        run: |
          python -m pytest -q \
            tests/utils \
            tests/test_phase_flags.py \
            tests/test_no_auto_log_regressions.py \
            tests/test_odds_api.py \
            tests/test_empirical_prior.py \
            tests/test_monte_carlo.py \
            tests/scanner/test_rule7_gate_enforcement.py \
            tests/e2e/test_signal_pipeline_smoke.py

      # ── HARD GATE 3: Node.js Worker contract tests ─────────────────────────
      # The 52+ deterministic tests in tests/js/worker.test.mjs are a production
      # betting-safety contract. They must pass on every PR — no exceptions.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node Worker contract tests
        run: node --test tests/js/worker.test.mjs

      # ── HARD GATE 4: Ruff Regression — blockt NEUE Violations,
      # existierender Altbestand steht in .ruff_baseline.json und
      # darf abgebaut werden, ohne CI zu brechen.
      - name: Ruff regression check (baseline-diff)
        run: python scripts/ruff_regression_check.py

      # ── HARD GATE 5: Release & Publication Provenance (TASK-P0B-004) ──
      # Production-critical release-truth contract. Must pass on every PR and push.
      - name: Provenance truth tests
        run: python -m pytest -q tests/monitoring/test_release_provenance.py

      # ── HARD GATE 6: P0C-001 Privacy / Public Serialization Boundary ──
      # Verifies that public static artifacts and public serializer contain no
      # private financial/identity state. P0 security contract — must pass on
      # every PR and push. Includes recursive private-key rejection and static
      # artifact scan (T1–T11, T13–T14 of the P0C-001 test specification).
      - name: Privacy serialization tests
        run: python -m pytest -q tests/privacy/test_public_serializer.py

      # ── HARD GATE 7: P0C-002 Authenticated Private State + Dual Fetch ──
      # Verifies:
      #   • Private serializer allowlist (Python): src/notifications/private_serializer.py
      #   • Worker GET /me contract (Node): tests/js/worker.test.mjs Suite 16
      #     — 401/403/404 semantics, exact-owner routing, master-token forbidden,
      #     cross-user rotate_token/token_status rejection, allowlist enforcement.
      #   • Browser dual-fetch static scans (T19–T22): no ?token= ingestion,
      #     no master token literals in shipped JS, no private fields in
      #     docs/data/signals*.json, worker.js exact-owner guards present.
      #   • P0C-001 regression: unauthenticated /signals.json still returns
      #     public-only payload (T10).
      # P0 security contract — must pass on every PR and push.
      - name: P0C-002 private serializer tests (Python)
        run: python -m pytest -q tests/privacy/test_private_serializer.py

      - name: P0C-002 Worker /me contract tests (Node)
        run: node --test tests/js/worker.test.mjs

      - name: P0C-002 dual-fetch + browser credential static scans (Python)
        run: |
          python -m pytest -q \
            tests/frontend/test_pwa_smoke.py::test_t19_browser_sources_have_no_api_or_master_token_literals \
            tests/frontend/test_pwa_smoke.py::test_t19b_no_active_createInvite_function \
            tests/frontend/test_pwa_smoke.py::test_t19c_no_browser_post_to_invite \
            tests/frontend/test_pwa_smoke.py::test_t19d_no_master_token_user_visible_copy \
            tests/frontend/test_pwa_smoke.py::test_t19e_no_editable_user_slot_authorization \
            tests/frontend/test_pwa_smoke.py::test_t20_browser_sources_do_not_ingest_query_token \
            tests/frontend/test_pwa_smoke.py::test_t21_static_signals_json_has_no_private_fields \
            tests/frontend/test_pwa_smoke.py::test_t22_worker_betting_safety_regression_boundary

      # ── HARD GATE 8: P0D-001 Runtime Writer Governance ────────────────────────
      # Verifies:
      #   I1. All paths staged by bot workflows are within the bot path allowlist.
      #   I2. Source paths are rejected by the allowlist (fail-closed).
      #   I3. No active workflow uses bare `git push || true` without retry.
      #   I4. provenance_meta.json is written only by ci_gates (source/runtime separation).
      #   I5. All committing workflows set observable writer identity.
      # Must pass on every PR and push.
      - name: Runtime writer governance tests
        run: python -m pytest -q tests/monitoring/test_writer_governance.py

      # ── PROVENANCE: record source release after all gates pass (main push only) ──
      # docs/data/provenance_meta.json is NOT in ci_gates paths-filter → no re-trigger.
      # C3: uses safe concurrent push with retry/rebase (mirrors consume_pending_bets.yml).
      - name: Record source release provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ci_gates.yml
        run: python3 scripts/record_source_release.py

      - name: Commit and push provenance_meta.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add docs/data/provenance_meta.json
          git diff --staged --quiet && exit 0
          git commit -m "auto: record source release ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --autostash --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict attempt $i"; continue; }
            git push origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          echo "[push] provenance push failed after 5 attempts — aborting" >&2
          exit 1
