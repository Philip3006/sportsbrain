name: Cloud Healer

on:
  # F5-D: Primary trigger is Worker Cron (every 30 min from Worker, with KV-based cooldown).
  # GH Actions schedule is a 2h fallback when Worker GH_TOKEN is not set.
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v4


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - name: Check health and retry failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          HEALTH = Path("docs/data/health.json")
          HEAL_LOG = Path("results/auto_heal_cloud.log")
          HEAL_LOG.parent.mkdir(exist_ok=True)

          # Jobs skipped entirely — too frequent or handled by their own retry cadence
          SKIP = {"consume_pending_bets", "aggregate_health"}

          # P0D-003: Only active, non-financial, non-model, idempotent workflows.
          # Financial workflows (settle, tennis_settle, bundesliga2_settle, closing_odds,
          # consume_pending_bets) and model workflows (auto_retrain, tennis_lgbm_retrain,
          # bundesliga2_retrain) are EXCLUDED — Tier 3, require human authorization.
          # Stale mappings to disabled workflows (daily_scan.yml.disabled,
          # auto_retrain.yml.disabled, settle.yml.disabled etc.) are removed.
          WORKFLOW_MAP = {
              "tennis_scan":       "tennis_scan.yml",
              "bundesliga2_scan":  "bundesliga2_scan.yml",
          }

          def log(msg):
              ts = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
              line = f"[{ts}] [cloud_healer] {msg}"
              print(line)
              with HEAL_LOG.open("a") as f:
                  f.write(line + "\n")

          if not HEALTH.exists():
              sys.exit(0)

          data = json.loads(HEALTH.read_text())
          if data.get("overall") == "ok":
              sys.exit(0)

          now = datetime.now(timezone.utc)
          triggered = []

          for job in data.get("jobs", []):
              name = job["job"]
              status = job["status"]

              if status == "ok":
                  continue
              if name in SKIP:
                  continue
              if name not in WORKFLOW_MAP:
                  log(f"{name}: kein Workflow-Mapping — übersprungen")
                  continue

              # Cooldown: nicht auslösen wenn letzter Run < 10 Min her
              last_run = job.get("last_run_at")
              if last_run:
                  last_dt = datetime.fromisoformat(last_run.replace("Z", "+00:00"))
                  age_s = (now - last_dt).total_seconds()
                  if age_s < 600:
                      log(f"{name}: letzter Run vor {int(age_s)}s — zu frisch, übersprungen")
                      continue

              wf = WORKFLOW_MAP[name]

              # Nicht auslösen wenn Workflow bereits läuft oder in Queue
              r_check = subprocess.run(
                  ["gh", "run", "list", "--workflow", wf, "--limit", "1",
                   "--json", "status", "--jq", ".[0].status"],
                  capture_output=True, text=True
              )
              active = r_check.stdout.strip().strip('"')
              if active in ("in_progress", "queued", "waiting"):
                  log(f"{name}: Workflow bereits aktiv ({active}) — übersprungen")
                  continue

              log(f"{name}: status={status} — triggere {wf}")
              r = subprocess.run(
                  ["gh", "workflow", "run", wf, "--ref", "main"],
                  capture_output=True, text=True
              )
              if r.returncode == 0:
                  log(f"{name}: erfolgreich ausgelöst")
                  triggered.append(name)
              else:
                  log(f"{name}: Trigger fehlgeschlagen: {r.stderr.strip()}")

          if not triggered:
              sys.exit(0)
          EOF

      - name: Upload heal log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-healer-log-${{ github.run_id }}
          path: results/auto_heal_cloud.log
          if-no-files-found: ignore
          retention-days: 7
