name: Tennis CLV Monitor (14d rolling)

on:
  schedule:
    # Täglich 07:15 UTC — nach dem 06:00-Scan
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clv-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Check Tennis CLV (14d)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: |
          # exit-code 0 (OK), 1 (WARN), 2 (CRITICAL) — GH Action zeigt Rot bei ≥1
          python3 scripts/monitor_clv.py --window-days 14 --push || {
            code=$?
            echo "CLV monitor exit-code $code (1=WARN, 2=CRITICAL)"
            exit $code
          }
