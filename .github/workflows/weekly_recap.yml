name: Weekly Recap Push

on:
  schedule:
    - cron: '0 20 * * 0'   # Sonntag 20:00 UTC (22:00 MESZ)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout private ledger (read-only)
        uses: actions/checkout@v4
        with:
          repository: Philip3006/sportsbrain-ledger
          token: ${{ secrets.LEDGER_PRIVATE_READ_PAT }}
          path: private-ledger
          fetch-depth: 1

      - name: Set ledger directory
        run: echo "SPORTSBRAIN_LEDGER_DIR=${{ github.workspace }}/private-ledger" >> $GITHUB_ENV

      - name: Send weekly recap
        env:
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: python scripts/weekly_recap.py
