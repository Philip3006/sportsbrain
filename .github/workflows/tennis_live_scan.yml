name: Tennis Live In-Play Scan (Hebel 5 Momentum)

on:
  schedule:
    # Alle 15 Min während typischer Match-Fenster (10-22 UTC).
    - cron: '*/15 10-22 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Live In-Play Scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/tennis_live_scan.py --min-edge 0.05 || true

      - name: Tennis Live Score Push
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
        run: python scripts/tennis_live_push.py || true

      - name: Commit live-signals
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add results/tennis_live_signals.json || true
          git add docs/data/tennis_live_scores.json || true
          git add -f data/cache/tennis_live_scores.json data/cache/tennis_suspended.json || true
          bash scripts/_bot_commit_push.sh "auto: tennis live $(date -u +%H:%M)"
