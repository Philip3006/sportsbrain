name: Nations League LIVE lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: nations-league-live-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare due market preflight
        id: market_preflight
        run: |
          set -o pipefail
          MARKET_SELECTION_AS_OF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MARKET_SNAPSHOT_PATH="/tmp/nations-league-live-market-snapshots.json"
          MARKET_ENRICHMENT_STORE="results/research/nations_league_v1_1_live_market_enrichment.jsonl"
          python3 scripts/acquire_nations_league_live_market.py \
            --manifest results/audits/nations_league_forward_fixture_manifest.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --enrichment-store "$MARKET_ENRICHMENT_STORE" \
            --as-of "$MARKET_SELECTION_AS_OF" \
            --output "$MARKET_SNAPSHOT_PATH" \
            --preflight \
            | tee /tmp/nations-league-live-market-capture.json
          NEEDS_PROVIDER="$(python3 -c 'import json, sys; print(str(json.load(open(sys.argv[1]))["needs_provider"]).lower())' "$MARKET_SNAPSHOT_PATH")"
          echo "needs_provider=$NEEDS_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "selection_as_of=$MARKET_SELECTION_AS_OF" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_PROVIDER" = "false" ]; then
            CYCLE_AS_OF="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["captured_at"])' "$MARKET_SNAPSHOT_PATH")"
            echo "CYCLE_AS_OF=$CYCLE_AS_OF" >> "$GITHUB_ENV"
          fi
      - name: Acquire due current 1X2 market snapshots
        if: ${{ steps.market_preflight.outputs.needs_provider == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
        run: |
          set -o pipefail
          MARKET_SNAPSHOT_PATH="/tmp/nations-league-live-market-snapshots.json"
          MARKET_ENRICHMENT_STORE="results/research/nations_league_v1_1_live_market_enrichment.jsonl"
          python3 scripts/acquire_nations_league_live_market.py \
            --manifest results/audits/nations_league_forward_fixture_manifest.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --enrichment-store "$MARKET_ENRICHMENT_STORE" \
            --as-of "${{ steps.market_preflight.outputs.selection_as_of }}" \
            --output "$MARKET_SNAPSHOT_PATH" \
            | tee /tmp/nations-league-live-market-capture.json
          CYCLE_AS_OF="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["captured_at"])' "$MARKET_SNAPSHOT_PATH")"
          echo "CYCLE_AS_OF=$CYCLE_AS_OF" >> "$GITHUB_ENV"
      - name: Execute current LIVE lifecycle
        run: |
          set -o pipefail
          SOURCE_PROVENANCE_MARKER="docs/data/provenance_"
          SOURCE_PROVENANCE_MARKER="${SOURCE_PROVENANCE_MARKER}meta.json"
          SOURCE_RELEASE_SHA="$(python3 scripts/resolve_nations_league_source_release.py --marker "$SOURCE_PROVENANCE_MARKER")"
          python3 scripts/nations_league_live_cycle.py \
            --manifest results/audits/nations_league_forward_fixture_manifest.json \
            --base-timeline results/research/nations_league_fixture_timeline_v1.json \
            --result-extension results/research/nations_league_v1_1_result_extension_20260930T200124Z.json \
            --registry results/audits/continuous_model_lifecycle_registry.json \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --market-enrichment-store results/research/nations_league_v1_1_live_market_enrichment.jsonl \
            --input-state-output /tmp/nations-league-live-input-state.json \
            --source-release-sha "$SOURCE_RELEASE_SHA" \
            --as-of "$CYCLE_AS_OF" \
            --market-snapshots /tmp/nations-league-live-market-snapshots.json \
            --execute-offline | tee /tmp/nations-league-live-cycle.json

      - name: Rebuild canonical LIVE public bundle
        run: |
          python3 scripts/build_nations_league_live_public.py \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --registry results/audits/continuous_model_lifecycle_registry.json \
            --binding results/audits/nations_league_v1_1_live_evidence_binding.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --market-enrichment-store results/research/nations_league_v1_1_live_market_enrichment.jsonl \
            --input docs/data/signals.json \
            --as-of "$CYCLE_AS_OF" \
            --output docs/data/signals.json
          python3 scripts/build_nations_league_live_public.py \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --registry results/audits/continuous_model_lifecycle_registry.json \
            --binding results/audits/nations_league_v1_1_live_evidence_binding.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --market-enrichment-store results/research/nations_league_v1_1_live_market_enrichment.jsonl \
            --input docs/data/signals_philip.json \
            --as-of "$CYCLE_AS_OF" \
            --output docs/data/signals_philip.json

      - name: Summarize canonical LIVE market-edge evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          capture = json.loads(Path("/tmp/nations-league-live-market-snapshots.json").read_text())
          public = json.loads(Path("docs/data/signals.json").read_text())["nations_league"]
          print(json.dumps({
              "needs_provider": capture["needs_provider"],
              "due_fixtures": capture["due_fixtures"],
              "request_count": capture["request_count"],
              "retry_count": capture["retry_count"],
              "provider": capture["provider"],
              "acquisition_status": capture["status"],
              "failure_reasons": capture["failure_reasons"],
              "snapshot_count": len(capture["snapshots"]),
              "captured_at": capture["captured_at"],
              "public_digest": public["public_digest"],
              "edge_statuses": [
                  {
                      "fixture_id": fixture["fixture_id"],
                      "phase": fixture["phase"],
                      "edge_status": fixture["edge_analysis"]["edge_status"],
                  }
                  for fixture in public["fixtures"]
              ],
          }, sort_keys=True))
          PY

      - name: Publish through the canonical Worker path when configured
        continue-on-error: true
        env:
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
        run: |
          if [ -z "$SIGNALS_CLOUD_URL" ] || [ -z "$SIGNALS_API_TOKEN" ]; then
            echo "Canonical Worker publication is not configured; skipping."
            exit 0
          fi
          EXPECTED_NL_DIGEST="$(python3 -c 'import json; print(json.load(open("docs/data/signals.json"))["nations_league"]["public_digest"])')"
          python3 scripts/republish_signals_to_cloud.py --expected-nl-digest "$EXPECTED_NL_DIGEST"

      - name: Persist changed LIVE state without creating a PR
        if: ${{ always() }}
        run: |
          git add \
            results/audits/continuous_model_lifecycle_registry.json \
            docs/data/signals.json \
            docs/data/signals_philip.json
          if [ -f results/research/nations_league_v1_1_live_prediction_store.jsonl ]; then
            git add results/research/nations_league_v1_1_live_prediction_store.jsonl
          fi
          if [ -f results/research/nations_league_v1_1_live_market_enrichment.jsonl ]; then
            git add results/research/nations_league_v1_1_live_market_enrichment.jsonl
          fi
          bash scripts/_bot_commit_push.sh "auto: Nations League LIVE lifecycle cycle"
