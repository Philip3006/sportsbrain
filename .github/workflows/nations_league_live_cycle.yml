name: Nations League LIVE lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: nations-league-live-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute current LIVE lifecycle
        run: |
          CYCLE_AS_OF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CYCLE_AS_OF=$CYCLE_AS_OF" >> "$GITHUB_ENV"
          SOURCE_PROVENANCE_MARKER="docs/data/provenance_"
          SOURCE_PROVENANCE_MARKER="${SOURCE_PROVENANCE_MARKER}meta.json"
          SOURCE_RELEASE_SHA="$(python3 scripts/resolve_nations_league_source_release.py --marker "$SOURCE_PROVENANCE_MARKER")"
          python3 scripts/nations_league_live_cycle.py \
            --manifest results/audits/nations_league_forward_fixture_manifest.json \
            --base-timeline results/research/nations_league_fixture_timeline_v1.json \
            --result-extension results/research/nations_league_v1_1_result_extension_20260930T200124Z.json \
            --registry results/audits/continuous_model_lifecycle_registry.json \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --input-state-output /tmp/nations-league-live-input-state.json \
            --source-release-sha "$SOURCE_RELEASE_SHA" \
            --as-of "$CYCLE_AS_OF" \
            --execute-offline | tee /tmp/nations-league-live-cycle.json

      - name: Rebuild canonical LIVE public bundle
        run: |
          python3 scripts/build_nations_league_live_public.py \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --registry results/audits/continuous_model_lifecycle_registry.json \
            --binding results/audits/nations_league_v1_1_live_evidence_binding.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --input docs/data/signals.json \
            --as-of "$CYCLE_AS_OF" \
            --output docs/data/signals.json
          python3 scripts/build_nations_league_live_public.py \
            --campaign results/research/nations_league_v1_1_forward_campaign_20260930T200124Z.json \
            --registry results/audits/continuous_model_lifecycle_registry.json \
            --binding results/audits/nations_league_v1_1_live_evidence_binding.json \
            --store results/research/nations_league_v1_1_live_prediction_store.jsonl \
            --input docs/data/signals_philip.json \
            --as-of "$CYCLE_AS_OF" \
            --output docs/data/signals_philip.json

      - name: Publish through the canonical Worker path when configured
        if: ${{ secrets.SIGNALS_CLOUD_URL != '' && secrets.SIGNALS_API_TOKEN != '' }}
        continue-on-error: true
        env:
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
        run: |
          EXPECTED_NL_DIGEST="$(python3 -c 'import json; print(json.load(open("docs/data/signals.json"))["nations_league"]["public_digest"])')"
          python3 scripts/republish_signals_to_cloud.py --expected-nl-digest "$EXPECTED_NL_DIGEST"

      - name: Persist changed LIVE state without creating a PR
        if: ${{ always() }}
        run: |
          git add \
            results/audits/continuous_model_lifecycle_registry.json \
            docs/data/signals.json \
            docs/data/signals_philip.json
          if [ -f results/research/nations_league_v1_1_live_prediction_store.jsonl ]; then
            git add results/research/nations_league_v1_1_live_prediction_store.jsonl
          fi
          bash scripts/_bot_commit_push.sh "auto: Nations League LIVE lifecycle cycle"
