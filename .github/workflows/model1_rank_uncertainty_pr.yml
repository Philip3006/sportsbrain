name: MODEL1 Rank + Uncertainty Audit

on:
  pull_request:
    branches: ['fix/fnd-model1-001-rolling-state-v2']
    paths:
      - 'scripts/model1_rank_uncertainty_audit.py'
      - '.github/workflows/model1_rank_uncertainty_pr.yml'
  workflow_dispatch:

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Quantify rank and uncertainty parity impact
        run: PYTHONPATH=. python scripts/model1_rank_uncertainty_audit.py
