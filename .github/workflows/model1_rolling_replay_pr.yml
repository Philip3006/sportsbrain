name: MODEL1-001 Replay Audit PR

on:
  pull_request:
    branches: ['fix/fnd-model1-001-rolling-state-v2']
    paths:
      - 'scripts/model1_rolling_replay_audit.py'
      - '.github/workflows/model1_rolling_replay_pr.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run deterministic MODEL1-001 replay
        run: python scripts/model1_rolling_replay_audit.py
