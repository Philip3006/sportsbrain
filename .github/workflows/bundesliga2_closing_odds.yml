name: 2.BL Closing Odds Snapshot

on:
  schedule:
    # 5 Minuten vor typischen 2.BL-Kickoff-Slots (CEST → UTC):
    # Fr 20:25 CEST = 18:25 UTC
    # Sa 12:55 CEST = 10:55 UTC  (13:00-Slot)
    # Sa 20:25 CEST = 18:25 UTC  (20:30-Slot)
    # So 13:25 CEST = 11:25 UTC  (13:30-Slot)
    - cron: '25 18 * * 5'
    - cron: '55 10 * * 6'
    - cron: '25 18 * * 6'
    - cron: '25 11 * * 0'
  workflow_dispatch:

concurrency:
  group: bundesliga2_closing_odds
  cancel-in-progress: false

jobs:
  closing-odds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Snapshot closing odds
        id: snap
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/bundesliga2_closing_odds.py
          echo "status=ok" >> $GITHUB_OUTPUT

      - name: Health snapshot
        if: always()
        run: |
          STATUS="${{ steps.snap.outputs.status || 'error' }}"
          python -m src.monitoring.health_writer \
            --job bundesliga2_closing_odds --status "$STATUS" --exit-code 0

      - name: Commit snapshot
        if: always()
        run: |
          git add -f data/cache/bundesliga2_closing_odds.json || true
          git add -f results/health/bundesliga2_closing_odds.json || true
          bash scripts/_bot_commit_push.sh "auto: bl2 closing odds $(date -u +%H:%M)"
