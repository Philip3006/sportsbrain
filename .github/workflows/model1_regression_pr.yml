name: MODEL1 Tennis Relevant Regression Audit

on:
  pull_request:
    branches: ['fix/fnd-model1-001-rolling-state-v2']
    paths:
      - '.github/workflows/model1_regression_pr.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile relevant code
        run: python -m compileall -q src/tennis src/models scripts/tennis_scan.py
      - name: Tennis + scanner + E2E regression
        run: PYTHONPATH=. python -m pytest -q tests/tennis tests/scanner tests/e2e
