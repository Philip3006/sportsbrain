name: Consume Pending Bets

on:
  # F5-C: Primary trigger is Worker Cron (every 5 min, only when KV has pending bets).
  # repository_dispatch receives event_type=consume_pending_bets from the Worker.
  repository_dispatch:
    types: [consume_pending_bets]
  # Fallback schedule (every 30 min) in case Worker GH_TOKEN is not set.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  consume:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0


      - name: Require green ci_gates for HEAD SHA (Phase-0 Gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/require_green_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Consume pending bets from Cloudflare KV
        id: consume
        env:
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
        run: python3 -m scripts.consume_pending_bets

      - name: Write health snapshot
        if: always()
        run: |
          mkdir -p results/health
          STATUS=$([[ "${{ steps.consume.outcome }}" == "failure" ]] && echo "error" || echo "ok")
          python3 -m src.monitoring.health_writer --job consume_pending_bets --status "$STATUS"

      - name: Aggregate & upload health
        if: always()
        env:
          SIGNALS_CLOUD_URL: ${{ secrets.SIGNALS_CLOUD_URL }}
          SIGNALS_API_TOKEN: ${{ secrets.SIGNALS_API_TOKEN }}
        run: python3 -m src.monitoring.aggregate_health --merge-from-committed

      - name: Commit health artifacts
        # Ledger persistence (results/ledger_*.csv) is handled by the consumer script
        # in Step "Consume pending bets" above — it commits and pushes before ACK'ing
        # KV entries (P0-A durable ACK invariant). This step handles health artifacts only.
        run: |
          git config user.name "SportsBrain Bot"
          git config user.email "bot@sportsbrain"
          git add docs/data/health.json || true
          git diff --staged --quiet && exit 0
          git commit -m "auto: consume health $(date +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase --autostash --strategy-option=theirs origin/main \
              || { git rebase --abort 2>/dev/null || true; echo "[push] rebase conflict attempt $i"; continue; }
            git push origin main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          echo "[push] giving up after 5 attempts" >&2; exit 1
